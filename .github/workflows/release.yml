name: Release

# Publishes to npm when a GitHub release is published, using npm trusted
# publishing (OIDC): no long-lived NPM_TOKEN is stored in the repository, and
# the package gets a provenance statement. Before the first run, add this
# repository and workflow as a trusted publisher on the package's npm settings
# page (the package must exist once, so the very first publish is manual).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag must match package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: npm test
      - name: Publish (skipped when this version is already on npm)
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "keepkeys@$v" version >/dev/null 2>&1; then
            echo "keepkeys@$v is already published; nothing to do"
          else
            npm publish --provenance --access public
          fi
