name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node bin/keepkeys.js --version
          cd "$(mktemp -d)" && git init -q
          echo "sk_test_ci_0123456789abcdef" | node "$GITHUB_WORKSPACE/bin/keepkeys.js" add STRIPE_SECRET_KEY --to .env.local --stdin
          grep -q '^/.env.local$' .gitignore

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Package has no dependencies
        run: node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if (p.dependencies && Object.keys(p.dependencies).length) process.exit(1)"
      - run: npm pack --dry-run
